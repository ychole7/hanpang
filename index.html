<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0604">
<title>한글팡</title>
<meta name="apple-mobile-web-app-title" content="한글팡">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/icon.png">
</head>
<body>

<div id="app">
  <!-- 최초 인트로 화면 -->
  <div id="introScreen">
    <button class="intro-start-btn" id="btnStartAdventure">🚀 모험 시작하기</button>
  </div>

  <div id="bgLayer"></div>

  <!-- 인게임 상단 UI (하트·엽전 제거, 설정 버튼 우측 정렬) -->
  <div id="topUI">
    <div class="top-menu-row" style="justify-content: flex-end;">
      <button class="icon-btn" id="btnSettings"></button>
    </div>
    
    <div class="stage-box"><div class="side-title">스테이지</div><div id="uiStage" class="big-num">1</div></div>
    <div class="target-box"><div class="target-title">목표 단어</div><div class="target-scroll-wrapper"><div id="targetBar"></div></div></div>
    <div class="score-box"><div class="side-title">점수</div><div id="uiScoreBig" class="big-num">0</div></div>
  </div>

  <div id="gameArea"><canvas id="cv"></canvas></div>

  <!-- 인게임 하단 UI -->
  <div id="bottomUI">
    <button class="item-btn" id="btnHint"><div class="badge" id="uiHint">3</div></button>
    <button class="item-btn" id="btnSwap"><div class="badge" id="uiSwap">3</div></button>
    <button class="item-btn" id="btnBomb"><div class="badge" id="uiBomb">2</div></button>
    <button class="item-btn" id="btnRainbow"><div class="badge" id="uiRainbow">2</div></button>
  </div>

  <div class="veil" id="veil"><div class="card" id="card"></div></div>
  
  <!-- 메인 화면 (지도) -->
  <div id="mapScreen">
    <div id="mapScroll">
      <div id="mapInner">
        <img class="map-bg-piece" src="assets/map_bg_4.png" alt="Winter">
        <img class="map-bg-piece" src="assets/map_bg_3.png" alt="Autumn">
        <img class="map-bg-piece" src="assets/map_bg_2.png" alt="Summer">
        <img class="map-bg-piece" src="assets/map_bg_1.png" alt="Spring">
      </div>
    </div>
    
    <div id="mapTopBar">
      <div class="map-top-left">
        <div class="custom-pill">
          <div class="pill-icon-float" style="background-image: url('assets/heart.png');"></div>
          <div class="pill-text-group">
            <b id="mapUI_lives">5</b>
            <span id="mapUI_timer">FULL</span>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click()">+</button>
        </div>

        <div class="custom-pill" style="margin-left: 10px;">
          <div class="pill-icon-float" style="background-image: url('assets/coin.png');"></div>
          <div class="pill-text-group">
            <b id="mapUI_coins">0</b>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click(); openShop();">+</button>
        </div>
      </div>

      <button class="map-icon-btn" id="btnMapSettings"></button>
    </div>
  </div>

  <!-- [업적] 전체 화면 탭 페이지 -->
  <div id="achieveScreen">
    <div class="achieve-wrapper">
      <div class="achieve-roof"></div>
      <div class="achieve-tab-row">
        <button class="achieve-tab active" id="tabAchieveBtn" onclick="SFX.click(); switchAchieveTab('achieve');">업적</button>
        <button class="achieve-tab" id="tabMissionBtn" onclick="SFX.click(); switchAchieveTab('mission');">일일 미션</button>
      </div>
      <div class="achieve-body">
        <div class="achieve-desc-text">다양한 업적을 달성하고 보상을 획득해보세요!</div>
        <div class="achieve-list-scroll" id="achieveContentBox"></div>
        <div class="achieve-footer-note">🌸 업적 보상은 즉시 지급됩니다.</div>
      </div>
    </div>
  </div>

  <!-- [상점] 전체 화면 탭 페이지 -->
  <div id="shopScreen">
    <div class="shop-wrapper">
      <div class="shop-roof"></div>
      <div class="shop-fake-tab"></div>
      <div class="shop-body">
        <div class="shop-coin-header">
          <img src="assets/coin.png" class="shop-coin-icon" alt="coin">
          <span>보유 엽전</span>
          <b id="shopUI_coins">730</b>
        </div>
        <div class="shop-list-scroll" id="shopContentBox"></div>
        <div class="shop-banner" onclick="alert('엽전 충전 기능 준비 중입니다! ✨');">
          <button class="shop-banner-btn">바로가기 &gt;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 글로벌 하단 바 -->
  <div id="globalBottomBar" style="display: none;">
    <button class="map-nav-btn" id="navAchieve" onclick="SFX.click(); openAchievePage();">
      <div class="nav-icon" style="background-image: url('assets/achievement.png');"></div>
      <span>업적</span>
    </button>
    <button class="map-nav-btn active" id="navHome" onclick="SFX.click(); openMap();">
      <div class="nav-icon" style="background-image: url('assets/home.png');"></div>
      <span>홈</span>
    </button>
    <button class="map-nav-btn" id="navShop" onclick="SFX.click(); openShop();">
      <div class="nav-icon" style="background-image: url('assets/shop.png');"></div>
      <span>상점</span>
    </button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
