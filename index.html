<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0604">
<title>낱글자 팡팡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div id="introScreen">
    <button class="intro-start-btn" id="btnStartAdventure">🚀 모험 시작하기</button>
  </div>

  <div id="bgLayer"></div>

  <!-- ✨ 상단 UI: 화면을 꽉 채우고 내부 글씨를 절대좌표로 배치 -->
  <div id="topUI">
    <div class="top-menu-row">
      <button class="icon-btn" id="btnMenu">❚❚</button>
      <button class="icon-btn" id="btnMute">🔊</button>
      <div class="stat-pill">❤️<b id="uiLives">6</b></div>
      <div class="stat-pill">💰<b id="uiCoins">0</b></div>
    </div>
    
    <!-- 좌측: 스테이지 -->
    <div class="stage-box">
      <div class="side-title">스테이지</div>
      <div id="uiStage" class="big-num">1</div>
    </div>
    
    <!-- 중앙: 목표 단어 (흰색 텍스트 & 가로 스크롤) -->
    <div class="target-box">
      <div class="target-title">목표 단어</div>
      <div class="target-scroll-wrapper">
        <div id="targetBar"></div>
      </div>
    </div>
    
    <!-- 우측: 점수 -->
    <div class="score-box">
      <div class="side-title">점수</div>
      <div id="uiScoreBig" class="big-num">0</div>
    </div>
  </div>

  <div id="gameArea">
    <canvas id="cv"></canvas>
  </div>

  <!-- ✨ 하단 UI 패널 -->
  <div id="bottomUI">
    <button class="item-btn" id="btnHint"><div class="badge" id="uiHint">3</div></button>
    <button class="item-btn" id="btnSwap"><div class="badge" id="uiSwap">3</div></button>
    <button class="item-btn" id="btnBomb"><div class="badge" id="uiBomb">2</div></button>
    <button class="item-btn" id="btnRainbow"><div class="badge" id="uiRainbow">2</div></button>
  </div>

  <div class="veil" id="veil"><div class="card" id="card"></div></div>
  <div id="mapVeil"><div id="mapScroll"></div><div id="mapLives"></div><div id="seasonTabs"></div></div>
</div>

<script src="game.js"></script>
</body>
</html>
