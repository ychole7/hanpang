<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0604">
<title>낱글자 팡팡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- 최초 인트로 화면 -->
  <div id="introScreen">
    <button class="intro-start-btn" id="btnStartAdventure">🚀 모험 시작하기</button>
  </div>

  <div id="bgLayer"></div>

  <!-- 인게임 상단 UI -->
  <div id="topUI">
    <div class="top-menu-row">
      <button class="icon-btn" id="btnSettings"></button>
      
      <div class="top-right-stats">
        <div class="custom-pill">
          <div class="pill-icon-float" style="background-image: url('assets/heart.png');"></div>
          <div class="pill-text-group">
            <b id="uiLives">6</b>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click()">+</button>
        </div>

        <div class="custom-pill" style="margin-left: 10px;">
          <div class="pill-icon-float" style="background-image: url('assets/coin.png');"></div>
          <div class="pill-text-group">
            <b id="uiCoins">0</b>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click(); openShop();">+</button>
        </div>
      </div>
    </div>
    
    <div class="stage-box"><div class="side-title">스테이지</div><div id="uiStage" class="big-num">1</div></div>
    <div class="target-box"><div class="target-title">목표 단어</div><div class="target-scroll-wrapper"><div id="targetBar"></div></div></div>
    <div class="score-box"><div class="side-title">점수</div><div id="uiScoreBig" class="big-num">0</div></div>
  </div>

  <div id="gameArea"><canvas id="cv"></canvas></div>

  <!-- 인게임 하단 UI -->
  <div id="bottomUI">
    <button class="item-btn" id="btnHint"><div class="badge" id="uiHint">3</div></button>
    <button class="item-btn" id="btnSwap"><div class="badge" id="uiSwap">3</div></button>
    <button class="item-btn" id="btnBomb"><div class="badge" id="uiBomb">2</div></button>
    <button class="item-btn" id="btnRainbow"><div class="badge" id="uiRainbow">2</div></button>
  </div>

  <div class="veil" id="veil"><div class="card" id="card"></div></div>
  
  <!-- 메인 화면 (사계절 순서: 아래 봄 -> 여름 -> 가을 -> 위 겨울) -->
  <div id="mapScreen">
    <div id="mapScroll">
      <div id="mapInner">
        <img class="map-bg-piece" src="assets/map_bg_4.png" alt="Winter">
        <img class="map-bg-piece" src="assets/map_bg_3.png" alt="Autumn">
        <img class="map-bg-piece" src="assets/map_bg_2.png" alt="Summer">
        <img class="map-bg-piece" src="assets/map_bg_1.png" alt="Spring">
      </div>
    </div>
    
    <div id="mapTopBar">
      <div class="map-top-left">
        <div class="custom-pill">
          <div class="pill-icon-float" style="background-image: url('assets/heart.png');"></div>
          <div class="pill-text-group">
            <b id="mapUI_lives">5</b>
            <span id="mapUI_timer">MAX</span>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click()">+</button>
        </div>

        <div class="custom-pill" style="margin-left: 10px;">
          <div class="pill-icon-float" style="background-image: url('assets/coin.png');"></div>
          <div class="pill-text-group">
            <b id="mapUI_coins">0</b>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click(); openShop();">+</button>
        </div>
      </div>

      <button class="map-icon-btn" id="btnMapSettings"></button>
    </div>
  </div>

  <!-- [업적] 전체 페이지 화면 -->
  <div id="achieveScreen" style="display:none;">
    <div class="rank-container" style="height: 78vh; max-height: 600px;">
      <div class="rank-header-roof">
        <div class="rank-sign-board">업 적</div>
      </div>

      <div class="rank-board-body" style="margin-top: 40px; padding: 14px;">
        <div style="font-size: 14px; font-weight: 900; color: #8a6a4a; margin-bottom: 10px; text-align: center;">
          도전을 완료하고 보상을 획득하세요! 🎁
        </div>
        <div class="rank-content-box" id="achieveContentBox" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- 업적 아이템들은 JS에서 동적으로 렌더링 됩니다 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 글로벌 하단 바 (순위 버튼 ➔ 업적 버튼으로 변경) -->
  <div id="globalBottomBar" style="display: none;">
    <button class="map-nav-btn" id="navAchieve" onclick="SFX.click(); openAchievePage();">
      <div class="nav-icon" style="background-image: url('assets/ranking.png');"></div>
      <span>업적</span>
    </button>
    <button class="map-nav-btn active" id="navHome" onclick="SFX.click(); openMap();">
      <div class="nav-icon" style="background-image: url('assets/home.png');"></div>
      <span>홈</span>
    </button>
    <button class="map-nav-btn" id="navShop" onclick="SFX.click(); openShop();">
      <div class="nav-icon" style="background-image: url('assets/shop.png');"></div>
      <span>상점</span>
    </button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
