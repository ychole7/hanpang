<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0604">
<title>낱글자 팡팡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- 최초 인트로 화면 -->
  <div id="introScreen">
    <button class="intro-start-btn" id="btnStartAdventure">🚀 모험 시작하기</button>
  </div>

  <div id="bgLayer"></div>

  <!-- 인게임 상단 UI -->
  <div id="topUI">
    <div class="top-menu-row">
      <button class="icon-btn" id="btnSettings"></button>
      
      <div class="top-right-stats">
        <div class="custom-pill">
          <div class="pill-icon-float" style="background-image: url('assets/heart.png');"></div>
          <div class="pill-text-group">
            <b id="uiLives">6</b> <span>MAX</span>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click()">+</button>
        </div>

        <div class="custom-pill" style="margin-left: 10px;">
          <div class="pill-icon-float" style="background-image: url('assets/coin.png');"></div>
          <div class="pill-text-group">
            <b id="uiCoins">0</b>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click(); openShop();">+</button>
        </div>
      </div>
    </div>
    
    <div class="stage-box"><div class="side-title">스테이지</div><div id="uiStage" class="big-num">1</div></div>
    <div class="target-box"><div class="target-title">목표 단어</div><div class="target-scroll-wrapper"><div id="targetBar"></div></div></div>
    <div class="score-box"><div class="side-title">점수</div><div id="uiScoreBig" class="big-num">0</div></div>
  </div>

  <div id="gameArea"><canvas id="cv"></canvas></div>

  <!-- 인게임 하단 UI -->
  <div id="bottomUI">
    <button class="item-btn" id="btnHint"><div class="badge" id="uiHint">3</div></button>
    <button class="item-btn" id="btnSwap"><div class="badge" id="uiSwap">3</div></button>
    <button class="item-btn" id="btnBomb"><div class="badge" id="uiBomb">2</div></button>
    <button class="item-btn" id="btnRainbow"><div class="badge" id="uiRainbow">2</div></button>
  </div>

  <div class="veil" id="veil"><div class="card" id="card"></div></div>
  
  <!-- 메인 화면 (사계절 연속 스크롤 맵 로비) -->
  <div id="mapScreen">
    <div id="mapScroll">
      <div id="mapInner">
        <!-- ✨ 아래에서 위로: 봄 -> 여름 -> 가을 -> 겨울 순서로 맵 조각 연속 배치 -->
        <img class="map-bg-piece" src="assets/map_bg_1.png" alt="Spring Map">
        <img class="map-bg-piece" src="assets/map_bg_2.png" alt="Summer Map">
        <img class="map-bg-piece" src="assets/map_bg_3.png" alt="Autumn Map">
        <img class="map-bg-piece" src="assets/map_bg_4.png" alt="Winter Map">
      </div>
    </div>
    
    <div id="mapTopBar">
      <div class="map-top-left">
        <div class="custom-pill">
          <div class="pill-icon-float" style="background-image: url('assets/heart.png');"></div>
          <div class="pill-text-group">
            <b id="mapUI_lives">5</b>
            <span id="mapUI_timer">MAX</span>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click()">+</button>
        </div>

        <div class="custom-pill" style="margin-left: 10px;">
          <div class="pill-icon-float" style="background-image: url('assets/coin.png');"></div>
          <div class="pill-text-group">
            <b id="mapUI_coins">0</b>
          </div>
          <button class="pill-plus-btn" onclick="SFX.click(); openShop();">+</button>
        </div>
      </div>

      <button class="map-icon-btn" id="btnMapSettings"></button>
    </div>
  </div>

  <!-- [순위] 전체 페이지 화면 -->
  <div id="rankScreen">
    <div class="rank-container">
      <div class="rank-header-roof">
        <div class="rank-sign-board">순 위</div>
      </div>

      <div class="rank-board-body">
        <div class="rank-tab-row">
          <button class="rank-tab-btn active" id="rankTabAll" onclick="switchRankTab('all')">전체 순위</button>
          <button class="rank-tab-btn" id="rankTabMy" onclick="switchRankTab('my')">내 순위</button>
        </div>

        <div class="rank-content-box" id="rankContentBox">
          <div id="rankViewAll" class="rank-view">
            <div class="rank-podium-row">
              <div class="podium-item rank-2">
                <div class="podium-medal">🥈</div>
                <div class="podium-avatar" style="background:#8fb9aa;">👧🏻</div>
                <div class="podium-name">세종대왕</div>
                <div class="podium-crown">🥈</div>
              </div>
              <div class="podium-item rank-1">
                <div class="podium-medal">🥇</div>
                <div class="podium-avatar" style="background:#e8c169;">👦🏻</div>
                <div class="podium-name">한글팡팡</div>
                <div class="podium-crown">👑</div>
              </div>
              <div class="podium-item rank-3">
                <div class="podium-medal">🥉</div>
                <div class="podium-avatar" style="background:#d49a6a;">👧🏽</div>
                <div class="podium-name">훈민정음</div>
                <div class="podium-crown">🥉</div>
              </div>
            </div>

            <div class="rank-list-scroll">
              <div class="rank-list-item"><span class="r-num">4</span><div class="r-avatar" style="background:#7ca9c0;">👦🏽</div><span class="r-name">한글좋아</span></div>
              <div class="rank-list-item"><span class="r-num">5</span><div class="r-avatar" style="background:#e29578;">👧🏼</div><span class="r-name">나랏말싸미</span></div>
              <div class="rank-list-item"><span class="r-num">6</span><div class="r-avatar" style="background:#83c5be;">👦🏼</div><span class="r-name">가나다라마바사</span></div>
              <div class="rank-list-item"><span class="r-num">7</span><div class="r-avatar" style="background:#ffb703;">👦🏻</div><span class="r-name">아름다운한글</span></div>
              <div class="rank-list-item"><span class="r-num">8</span><div class="r-avatar" style="background:#fb8500;">👧🏻</div><span class="r-name">한글짱짱</span></div>
            </div>
          </div>

          <div id="rankViewMy" class="rank-view" style="display:none;">
            <div class="my-rank-card">
              <div class="my-rank-badge">🏆 내 현재 순위</div>
              <div class="my-rank-score-box">
                <div class="my-avatar-big" style="background:#e8c169;">👦🏻</div>
                <div class="my-info">
                  <h3>기획자님</h3>
                  <p>상위 <b>5%</b> 이내 진입중!</p>
                </div>
              </div>
              <div class="my-stats-row">
                <div>순위: <b>12위</b></div>
                <div>최고 점수: <b>77,700점</b></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 글로벌 하단 바 -->
  <div id="globalBottomBar" style="display: none;">
    <button class="map-nav-btn" id="navRank" onclick="SFX.click(); showNavTab('rank');">
      <div class="nav-icon" style="background-image: url('assets/ranking.png');"></div>
      <span>순위</span>
    </button>
    <button class="map-nav-btn active" id="navHome" onclick="SFX.click(); showNavTab('home');">
      <div class="nav-icon" style="background-image: url('assets/home.png');"></div>
      <span>홈</span>
    </button>
    <button class="map-nav-btn" id="navShop" onclick="SFX.click(); showNavTab('shop');">
      <div class="nav-icon" style="background-image: url('assets/shop.png');"></div>
      <span>상점</span>
    </button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
