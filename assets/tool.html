<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스톤 좌표 추출기</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  #mapContainer { position: relative; max-width: 480px; width: 100%; cursor: crosshair; border: 3px solid #dcb274; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  .map-piece { display: block; width: 100%; height: auto; pointer-events: none; margin: 0; padding: 0; }
  .marker { position: absolute; width: 32px; height: 32px; background: #ff9a5c; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.6); pointer-events: none; z-index: 10; }
  #outputBox { margin-top: 20px; width: 100%; max-width: 480px; background: #222; border: 2px solid #444; border-radius: 12px; padding: 14px; }
  textarea { width: 100%; height: 120px; background: #111; color: #8ef9f3; border: 1px solid #555; border-radius: 8px; padding: 8px; font-family: monospace; font-size: 13px; resize: vertical; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  button { flex: 1; padding: 10px; font-weight: bold; background: #dcb274; border: none; border-radius: 8px; color: #2a1c12; cursor: pointer; }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>

  <h2 style="margin: 0 0 10px; font-size: 18px; color: #f5e3ae;">🗺️ 스테이지 스톤 좌표 추출기</h2>
  <p style="margin: 0 0 15px; font-size: 13px; color: #aaa; text-align: center;">맵 이미지를 클릭하면 해당 위치의 퍼센트 좌표가 아래 박스에 쫘르륵 쌓입니다!</p>

  <div id="mapContainer">
    <!-- 현재 프로젝트의 assets 폴더 내 실제 파일명과 정확히 일치하도록 설정 -->
    <img class="map-piece" src="map_bg_4.png" alt="Winter">
    <img class="map-piece" src="map_bg_3.png" alt="Autumn">
    <img class="map-piece" src="map_bg_2.png" alt="Summer">
    <img class="map-piece" src="map_bg_1.png" alt="Spring">
  </div>

  <div id="outputBox">
    <div style="font-size: 13px; margin-bottom: 6px; font-weight: bold; color: #ffe08c;">추출된 좌표 결과 (복사해서 제게 주시면 됩니다):</div>
    <textarea id="resultArea" placeholder="지도를 클릭하면 여기에 좌표가 기록됩니다..."></textarea>
    <div class="btn-row">
      <button onclick="copyCoords()">📋 전체 복사하기</button>
      <button onclick="clearCoords()" style="background: #e55a2b; color: #fff;">🔄 초기화</button>
    </div>
  </div>

<script>
  let stageCount = 1;
  const container = document.getElementById('mapContainer');
  const resultArea = document.getElementById('resultArea');
  
  let coordsList = [];

  container.addEventListener('click', function(e) {
    const rect = container.getBoundingClientRect();
    const xPx = e.clientX - rect.left;
    const yPx = e.clientY - rect.top;

    const xPct = Number(((xPx / rect.width) * 100).toFixed(1));
    const yPct = Number(((yPx / rect.height) * 100).toFixed(1));

    const marker = document.createElement('div');
    marker.className = 'marker';
    marker.style.left = xPct + '%';
    marker.style.top = yPct + '%';
    marker.textContent = stageCount;
    container.appendChild(marker);

    coordsList.push(`{x:${xPct}, y:${yPct}}, /* 스테이지 ${stageCount} */`);
    resultArea.value = coordsList.join('\n');
    
    stageCount++;
  });

  function copyCoords() {
    resultArea.select();
    document.execCommand('copy');
    alert('클립보드에 복사되었습니다! 저에게 톡으로 붙여넣어 주세요.');
  }

  function clearCoords() {
    if(confirm('기록된 좌표를 모두 초기화할까요?')) {
      coordsList = [];
      stageCount = 1;
      resultArea.value = '';
      container.querySelectorAll('.marker').forEach(m => m.remove());
    }
  }
</script>

</body>
</html>
